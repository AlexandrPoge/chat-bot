<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — widget demo site</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f8faf6; color: #202823; font-family: Arial, Helvetica, sans-serif; }
      nav { display: flex; max-width: 1120px; align-items: center; justify-content: space-between; margin: 0 auto; padding: 22px 28px; }
      .brand { font-weight: 800; letter-spacing: -.04em; font-size: 22px; }
      .links { color: #687267; font-size: 14px; }
      .hero { max-width: 1120px; margin: 56px auto; padding: 74px 42px; border-radius: 28px; background: linear-gradient(130deg, #deffc1, #eff6e7 48%, #d9f0ea); }
      .eyebrow { color: #60883d; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 680px; margin: 16px 0; font-size: clamp(48px, 8vw, 92px); line-height: .92; letter-spacing: -.075em; }
      p { max-width: 520px; color: #5b665b; font-size: 17px; line-height: 1.6; }
      button { border: 0; border-radius: 11px; background: #202823; color: white; padding: 14px 18px; font-weight: 700; }
      .note { max-width: 1120px; margin: 0 auto; padding: 0 28px; color: #899488; font-size: 13px; }
      @media (max-width: 700px) { .hero { margin: 16px; padding: 42px 24px; } nav { padding: 18px 22px; } }
    </style>
  </head>
  <body>
    <nav><span class="brand">orbit</span><span class="links">Product · Pricing · Docs</span></nav>
    <main class="hero">
      <div class="eyebrow">Collaborative workspaces</div>
      <h1>Make every project feel in orbit.</h1>
      <p>Bring tasks, teammates, clients and every important decision into one calm, considered workspace.</p>
      <button>Start a free workspace</button>
    </main>
    <p class="note" id="demo-note">This fictional marketing site demonstrates a real published Helpwise widget.</p>
    <script>
      const query = new URLSearchParams(window.location.search);
      const botId = query.get("bot");
      if (botId) {
        const widget = document.createElement("script");
        widget.src = "/widget.js";
        widget.async = true;
        widget.dataset.bot = botId;
        widget.dataset.open = "true";
        if (query.get("source")) widget.dataset.source = query.get("source");
        document.body.appendChild(widget);
      } else {
        document.getElementById("demo-note").textContent = "Publish a bot in Helpwise, then open its test site from the Widget page.";
      }
    </script>
  </body>
</html>
